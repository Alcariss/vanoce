<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vánoční Dárky</title>
    <meta name="description" content="Přehled vánočních dárků pro celou rodinu - organizace a správa dárků">
    <meta name="theme-color" content="#007BFF">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="apple-touch-icon" sizes="60x60" href="icon-60.png">
    <link rel="apple-touch-icon" sizes="76x76" href="icon-76.png">
    <link rel="apple-touch-icon" sizes="120x120" href="icon-120.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎄 Vánoční Dárky</h1>
            <p class="subtitle">Přehled vánočních dárků pro celou rodinu</p>
            <div class="version-info" id="version-info" onclick="forceUpdate()" title="Klikněte pro aktualizaci aplikace">
                Verze: <span id="app-version">1.3.0</span>
            </div>
        </header>

        <div class="dashboard-card">
            <div class="dashboard-header">
                <h3>Přehled dárků</h3>
                <div class="total-info">
                    Celkem: <span id="total-gifts">0</span> dárků
                </div>
            </div>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-segment vyjasnit" id="progress-vyjasnit"></div>
                    <div class="progress-segment objednano" id="progress-objednano"></div>
                    <div class="progress-segment zabaleno" id="progress-zabaleno"></div>
                    <div class="progress-segment hotovo" id="progress-hotovo"></div>
                </div>
                <div class="progress-legend">
                    <div class="legend-item">
                        <span class="legend-color vyjasnit"></span>
                        <span>Vyjasnit: <span id="vyjasnit-count">0</span></span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color objednano"></span>
                        <span>Objednáno: <span id="objednano-count">0</span></span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color zabaleno"></span>
                        <span>Zabaleno: <span id="zabaleno-count">0</span></span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color hotovo"></span>
                        <span>Hotovo: <span id="hotovo-count">0</span></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-secondary" onclick="loadGifts()">
                <span class="btn-icon">🔄</span>
                Obnovit
            </button>
            <button class="btn btn-primary" onclick="toggleAddForm()">
                <span class="btn-icon">+</span>
                Přidat dárek
            </button>
        </div>

        <!-- Filters -->
        <div id="filters-container" class="filters-container" style="display: none;">
            <h3 class="filters-title">Filtrovat podle příjemce:</h3>
            <div id="filters" class="filters">
                <!-- Filter buttons will be populated here -->
            </div>
        </div>

        <!-- Add Gift Form -->
        <div id="add-form" class="form-container" style="display: none;">
            <h3>Přidat nový dárek</h3>
            <form onsubmit="addGift(event)">
                <div class="form-group">
                    <label for="kdo">Pro koho:</label>
                    <select id="kdo" name="kdo" required>
                        <option value="">Vyberte příjemce...</option>
                    </select>
                    <input type="text" id="kdo-new" placeholder="Nebo napište nového příjemce..." style="margin-top: 8px; display: none;">
                    <button type="button" id="add-new-recipient" style="margin-top: 8px; padding: 4px 8px; font-size: 12px;">+ Přidat nového příjemce</button>
                </div>
                <div class="form-group">
                    <label for="odKoho">Od koho:</label>
                    <input type="text" id="odKoho" name="odKoho" placeholder="Např. Honza">
                </div>
                <div class="form-group">
                    <label for="co">Co:</label>
                    <input type="text" id="co" name="co" required placeholder="Např. Kniha o vaření">
                </div>
                <div class="form-group">
                    <label for="odkaz">Odkaz:</label>
                    <input type="url" id="odkaz" name="odkaz" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label for="status">Status:</label>
                    <select id="status" name="status" required>
                        <option value="Vyjasnit">Vyjasnit</option>
                        <option value="Objednano">Objednano</option>
                        <option value="Zabaleno">Zabaleno</option>
                        <option value="Hotovo">Hotovo</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Přidat dárek</button>
                    <button type="button" class="btn btn-secondary" onclick="hideAddForm()">Zrušit</button>
                </div>
            </form>
        </div>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Načítání...</p>
        </div>

        <!-- Error Message -->
        <div id="error" class="error" style="display: none;"></div>

        <!-- Success Message -->
        <div id="success" class="success" style="display: none;"></div>

        <!-- Gifts Grid -->
        <div id="gifts-container" class="gifts-grid">
            <!-- Gifts will be populated here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
